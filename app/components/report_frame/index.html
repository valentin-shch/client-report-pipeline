<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; }
  #report { display: block; border: 0; width: 100%; margin: 0 auto; transform-origin: top left; }
</style>
</head>
<body>
<iframe id="report" scrolling="no" title="report"></iframe>
<script>
  // Minimal Streamlit component: takes the report HTML as an arg, renders it in
  // a same-origin srcdoc iframe, and tells Streamlit the iframe's real content
  // height so there's no fixed guess and no leftover whitespace.
  //
  // This speaks the component postMessage protocol directly (componentReady /
  // render / setFrameHeight) rather than bundling streamlit-component-lib, to
  // keep the app build-step-free. That protocol has been stable for years; if a
  // Streamlit upgrade ever changes it, the symptom is a wrong embed height:
  // check here first.
  var frame = document.getElementById("report");
  var last = 0;
  var mode = "auto";
  var scale = 1;

  // "auto" fills the space, so the report's own layout follows the screen.
  // "phone" and "desktop" pin it to those widths; desktop is scaled down to fit
  // a narrow screen, the way a wide email looks zoomed out on a phone.
  var WIDTHS = { phone: 375, desktop: 680 };
  function layout() {
    var fixed = WIDTHS[mode];
    var room = document.body.clientWidth;
    scale = fixed && fixed > room ? room / fixed : 1;
    frame.style.width = fixed ? fixed + "px" : "100%";
    frame.style.transform = scale < 1 ? "scale(" + scale + ")" : "none";
    frame.style.marginLeft = scale < 1 ? "0" : "";
    last = 0;
    measure();
  }
  var STORAGE_KEY = "crp_report_frame_height";

  // Streamlit remounts this whole iframe (a fresh componentReady) on every rerun,
  // e.g. switching client/week/theme, not just on first load. Without this, each
  // switch would collapse the report to the placeholder height below and snap
  // back once the new one measures, which reads as the report flickering out and
  // back in. Remembering the last real height and starting there instead means
  // the box barely moves; only the true first load in a tab uses the guess.
  function rememberedHeight() {
    try {
      return parseInt(sessionStorage.getItem(STORAGE_KEY), 10) || 400;
    } catch (e) {
      return 400;
    }
  }

  function setHeight(h) {
    window.parent.postMessage(
      { isStreamlitMessage: true, type: "streamlit:setFrameHeight", height: h }, "*"
    );
    try { sessionStorage.setItem(STORAGE_KEY, String(h)); } catch (e) { /* private mode */ }
  }

  function measure() {
    try {
      var doc = frame.contentDocument;
      if (!doc || !doc.body) return;
      var h = Math.ceil(doc.body.scrollHeight) + 4;
      if (h !== last) {
        last = h;
        frame.style.height = h + "px";
        setHeight(Math.ceil(h * scale));  // a scaled-down report takes less room
      }
    } catch (e) { /* not ready */ }
  }

  window.addEventListener("message", function (ev) {
    if (!ev.data || ev.data.type !== "streamlit:render") return;
    var args = ev.data.args || {};
    mode = args.mode || "auto";
    if (frame.srcdoc !== (args.html || "")) frame.srcdoc = args.html || "";
    layout();
  });
  window.addEventListener("resize", layout);

  frame.addEventListener("load", function () {
    measure();
    // base64 images can still be decoding: re-measure briefly, then watch.
    var n = 0;
    var poll = setInterval(function () {
      measure();
      if (++n > 12) clearInterval(poll);
    }, 120);
    try {
      new ResizeObserver(measure).observe(frame.contentDocument.body);
    } catch (e) { /* older browsers */ }
  });

  window.parent.postMessage(
    { isStreamlitMessage: true, type: "streamlit:componentReady", apiVersion: 1 }, "*"
  );
  setHeight(rememberedHeight());
</script>
</body>
</html>
