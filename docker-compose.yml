services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/local-init.sql:/docker-entrypoint-initdb.d/local-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  adsapi:
    build:
      context: .
      dockerfile: adsapi/Dockerfile
    # Only its own settings: the API has no business seeing the database URL.
    environment:
      ADSAPI_KEY: ${ADSAPI_KEY}
      FAULT_RATE: ${FAULT_RATE:-0}
      RATE_LIMIT_PER_MIN: ${RATE_LIMIT_PER_MIN:-60}
    ports:
      - "127.0.0.1:8000:8000"

volumes:
  pgdata:
