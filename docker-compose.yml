services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/local-init.sql:/docker-entrypoint-initdb.d/local-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  adsapi:
    build:
      context: .
      dockerfile: adsapi/Dockerfile
    env_file: .env
    ports:
      - "8000:8000"

volumes:
  pgdata:
